name: run main.py

on:
  schedule:
    - cron: '0 */12 * * *'
  
  # Manual trigger for running the workflow
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: checkout repo content
        uses: actions/checkout@v2

      - name: setup python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Decrypt cookies.txt
        env:
          PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          gpg --quiet --batch --yes --decrypt --passphrase="$PASSPHRASE" \
          --output cookies.txt cookies.firefox-private.txt.gpg

      - name: install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
          ffmpeg \
          vim \
          && sudo apt-get clean

      - name: install python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: update yt-dlp
        run: |
          pip install --upgrade yt-dlp

      - name: view check extracted file
        run: |
          cat cookies.txt

      - name: yt-dlp test
        run: |
          yt-dlp -vU --cookies cookies.txt https://www.youtube.com/shorts/LxQi1DFRCOo
          
      - name: Run Python Script
        env:
          SERVICE_ACCOUNT_KEY: ${{ secrets.SERVICE_ACCOUNT_KEY }}
          YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS }}
        run: python main.py
        
